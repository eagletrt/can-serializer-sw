[platformio]
src_dir = .
include_dir = .

[env:stm32h723]
platform = ststm32
board = nucleo_h723zg
upload_protocol = stlink
monitor_speed = 115200
board_build.ldscript = STM32H723XG_FLASH.ld
platform_packages = toolchain-gccarmnoneeabi@~1.120301.0

lib_deps = https://github.com/eagletrt/libeagletrt-sw#v0.1.0

build_src_filter = 
	+<**/*.c>
	+<*.s>
    -<Middlewares/tinyusb/examples/> 
    -<Middlewares/tinyusb/hw/> 
    -<Middlewares/tinyusb/test/>
    -<Middlewares/tinyusb/lib/>
    +<Middlewares/tinyusb/src/tusb.c>
    +<Middlewares/tinyusb/src/device/usbd.c>
    +<Middlewares/tinyusb/src/device/usbd_control.c>
    +<Middlewares/tinyusb/src/class/cdc/cdc_device.c>
    +<Middlewares/tinyusb/src/common/tusb_fifo.c>
    +<Middlewares/tinyusb/src/portable/synopsys/dwc2/dcd_dwc2.c>

build_flags = 
    -ICore/Inc
    -IUSB_DEVICE/App
    -IUSB_DEVICE/Target
    -IDrivers/STM32H7xx_HAL_Driver/Inc
    -IDrivers/STM32H7xx_HAL_Driver/Inc/Legacy
    -IMiddlewares/tinyusb/src
    -IMiddlewares/tinyusb/src/device
    -IMiddlewares/tinyusb/src/class/cdc
    -IDrivers/CMSIS/Device/ST/STM32H7xx/Include
    -IDrivers/CMSIS/Include
    -DUSE_PWR_LDO_SUPPLY
    -DUSE_HAL_DRIVER
    -DSTM32H723xx
    -DCFG_TUSB_CONFIG_FILE=\"tusb_config.h\"
    -Wall 
    -Wextra 
    -Wpedantic 

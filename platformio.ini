[platformio]
src_dir = .
include_dir = .
test_dir = Core/Test
default_envs = release

[env:release]
platform = ststm32
upload_protocol = stlink
debug_tool = stlink
platform_packages =
  toolchain-gccarmnoneeabi@=1.140201.0
monitor_speed = 115200
extra_scripts = pre:scripts/build_script.py

board = nucleo_h723zg
board_build.ldscript = STM32H723xG_flash.ld

build_flags =
    -std=gnu23
    -DUSE_HAL_DRIVER
    -ICore/Inc
    -ICore/Inc/usb/tinyusb
    -ICore/Inc/usb/gs_usb
    -Ivendor/tinyusb/src/
    -IDrivers/STM32H7xx_HAL_Driver/Inc/
    -IDrivers/STM32H7xx_HAL_Driver/Inc/Legacy/
    -IDrivers/CMSIS/Include/
    -IDrivers/CMSIS/Device/ST/STM32H7xx/Include/

build_src_filter =
    +<Core/Src/>
    +<Core/Src/usb/tinyusb/>
    +<Core/Src/usb/gs_usb/>
    +<vendor/tinyusb/src/>
    +<Drivers/STM32H7xx_HAL_Driver/Src/>
    -<Drivers/STM32H7xx_HAL_Driver/Src/*_template.c>
    +<./startup_stm32h723xx.s>

lib_deps =
    https://github.com/eagletrt/libeagletrt-sw#v0.1.0

check_tool = clangtidy
check_flags =
    clangtidy: --checks=-*,cert-*,clang-analyzer-*,bugprone-*,performance-*,readability-*,-bugprone-easily-swappable-parameters
    clangtidy: --warnings-as-errors=clang-analyzer-*,bugprone-*
    clangtidy: --header-filter=^.*Core/(Inc|Src)/.+/[^/]+\.(c|h)$
    clangtidy: --system-headers=false
check_src_filters =
    -<**>

[env:tests]
platform = native
test_framework = unity
test_build_src = true
build_flags =
    -std=gnu23
    -DEAGLETRT_STATIC=
    -DEAGLETRT_STATIC_INLINE=

build_src_filter =

lib_deps =
    https://github.com/eagletrt/libeagletrt-sw#v0.1.0
